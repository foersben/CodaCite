services:
  surrealdb:
    image: docker.io/surrealdb/surrealdb:v3.0.5
    container_name: surrealdb
    ports:
      - "8000:8000"
    command: >
      start
      --log trace
      --user root
      --pass root
      surrealkv:///var/lib/surrealdb
    volumes:
      - ./data/db:/var/lib/surrealdb
    healthcheck:
      test: ["CMD", "/surreal", "isready", "--endpoint", "http://localhost:8000"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: codacite
    ports:
      - "8080:8080"
    environment:
      - SURREALDB_URL=ws://surrealdb:8000
      - SURREALDB_USER=root
      - SURREALDB_PASS=root
      - SURREALDB_NS=codacite
      - SURREALDB_DB=production
      - MODELS_DIR=/app/data/models
      - UPLOAD_DIR=/app/data/blobs
      - UV_CACHE_DIR=/app/.cache/uv
      - UV_PYTHON_INSTALL_DIR=/app/.cache/uv_python
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - USE_LOCAL_NLP_MODELS=${USE_LOCAL_NLP_MODELS:-true}
      - LOCAL_LLM_PATH=${LOCAL_LLM_PATH}
    volumes:
      - ./app:/app/app:ro
      - ./pyproject.toml:/app/pyproject.toml:ro
      - ./uv.lock:/app/uv.lock:ro
      - ./.cache/uv:/app/.cache/uv
      - ./.cache/uv_python:/app/.cache/uv_python
      - ./data/models:/app/data/models
      - ./data/blobs:/app/data/blobs
      - ./data/logs:/app/data/logs
    depends_on:
      surrealdb:
        condition: service_healthy
